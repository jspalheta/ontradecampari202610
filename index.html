<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OnTRADE CAMPARI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#C60C2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OnTRADE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#161E2E; --muted:#5A6375; --line:#D7DBE3;
  --red:#C8102E; --on-red:#FFFFFF; --navy:#1E3A6E; --on-navy:#FFFFFF; --navy-soft:#E6ECF5; --red-soft:#FBE7EA; --ok:#1E7A4C; --alerta:#B5540F;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151C; --surface:#1A1F29; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2C3342;
    --red:#EF4A5C; --on-red:#1A0005; --navy:#8FB0E8; --on-navy:#0B1630; --navy-soft:#1A2640; --red-soft:#3A1A20; --ok:#5CC08C; --alerta:#F0985A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1A1F29; --ink:#E9ECF2; --muted:#9AA3B5; --line:#2C3342;
  --red:#EF4A5C; --on-red:#1A0005; --navy:#8FB0E8; --on-navy:#0B1630; --navy-soft:#1A2640; --red-soft:#3A1A20; --ok:#5CC08C; --alerta:#F0985A;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:inherit;color:inherit}
a{color:var(--navy)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Tela inicial */
.home{padding:34px 0 40px}
.marca-topo{font:700 15px/1 var(--cond);letter-spacing:.5px;color:var(--red);margin:0 0 30px}
.dev{font:700 clamp(46px,13vw,76px)/.92 var(--cond);margin:0}
.marcas{font:600 clamp(19px,5vw,24px)/1.2 var(--cond);margin:12px 0 0;color:var(--navy);letter-spacing:.3px}
.canal{display:inline-block;margin-top:12px;background:var(--red);color:var(--on-red);font:700 15px/1 var(--cond);padding:6px 10px 5px;border-radius:4px;letter-spacing:.6px}
.cenarios{display:grid;gap:12px;margin-top:34px}
.cenario{display:block;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--navy);border-radius:10px;padding:18px 18px 16px}
.cenario.cad{border-left-color:var(--red)}
.cenario h2{font:700 25px/1.1 var(--cond);margin:0}
.cenario p{margin:4px 0 0;color:var(--muted);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;margin-top:14px}
.barra-p{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.barra-p i{display:block;height:100%;background:var(--navy)}
.cenario.cad .barra-p i{background:var(--red)}
.prog b{font:700 18px/1 var(--cond);white-space:nowrap}
.home-acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* Cabeçalho interno */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px}
.voltar{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0;display:inline-flex;align-items:center;gap:4px}
.voltar svg{width:18px;height:18px}
.titulo{font:700 26px/1.05 var(--cond);margin:6px 0 0}
.tabs{display:flex;gap:22px;margin-top:6px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 0 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-color:var(--red)}
main{padding-bottom:56px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.sm{min-height:34px;padding:0 10px;font-size:14px}
.btn.perigo{color:var(--alerta);background:none;border-color:transparent}

/* Dias */
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0 4px}
.dia{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 2px 7px;text-align:center;cursor:pointer;color:var(--ink)}
.dia b{display:block;font:700 22px/1 var(--cond)}
.dia span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.dia[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.dia[aria-pressed="true"] span{color:var(--on-red)}
.dia.hoje::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--navy)}
.dia[aria-pressed="true"].hoje::after{background:var(--on-red)}
.legenda{font-size:13px;color:var(--muted);margin:0 0 10px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.filtros input{flex:1 1 220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button,.seg label{border:0;background:none;cursor:pointer;margin:0;position:relative}
.seg button{padding:7px 12px;font-size:14px;font-weight:500}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.resumo-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.resumo-linha p{margin:0}
.resumo-linha strong{font:700 21px/1 var(--cond);margin-right:3px}

/* Lista */
.lista{list-style:none;margin:0;padding:0}
.cli{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.status{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center}
.status.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.status svg{width:13px;height:13px}
.cli-nome{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:600 17px/1.25 var(--sans);color:var(--ink)}
.cli-nome:hover{text-decoration:underline;text-underline-offset:3px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{border-color:var(--ok);color:var(--ok)}
.tag.red{border-color:var(--red);color:var(--red)}
.acoes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vazio{padding:34px 0;text-align:center;color:var(--muted)}
.docs{display:grid;gap:6px}
.doc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:15px}
.doc input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--navy)}
.mini{display:flex;flex-wrap:wrap;gap:2px 16px;margin:4px 0 0;font-size:14px;color:var(--muted)}
.mini b{color:var(--ink);font-weight:600}
.app-box{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.app-box p{margin:0;font-weight:600}

/* Campos */
label.campo,.rot{display:block;font-size:14px;font-weight:600;margin:14px 0 4px}
.dica{font-size:13px;color:var(--muted);margin:4px 0 0}
input[type=text],input[type=url],input[type=tel],input[type=email],input[type=search],input[type=number],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.opcoes{display:flex;gap:6px;flex-wrap:wrap}
.opcoes label{position:relative}
.opcoes input{position:absolute;opacity:0;pointer-events:none}
.opcoes span{display:block;padding:8px 16px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;background:var(--bg)}
.opcoes input:checked+span{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.opcoes input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px}
.vol{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.vol{grid-template-columns:1fr 1fr}}
.vol label{display:block;border:1px solid var(--line);border-radius:8px;padding:8px 10px 10px;background:var(--bg)}
.vol b{display:block;font:700 18px/1.1 var(--cond);margin-bottom:6px}
.vol input{background:var(--surface);text-align:right}

/* Diálogo do cliente */
dialog{border:0;padding:0;width:min(680px,100%);max-width:100%;max-height:94vh;max-height:94dvh;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;margin:auto auto 0;overflow:auto}
@media (min-width:720px){dialog{margin:auto;border-radius:14px}}
dialog::backdrop{background:rgba(8,12,22,.55)}
.s-head{position:sticky;top:0;z-index:1;background:var(--surface);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.s-head h2{font:700 23px/1.1 var(--cond);margin:0}
.s-body{padding:4px 18px 18px}
.s-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fechar{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}
.fechar svg{width:22px;height:22px}
details.ficha-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:14px}
details.ficha-box summary{cursor:pointer;font-weight:600}
.ficha{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:10px 0 2px;font-size:14px}
.ficha dt{color:var(--muted)}
.ficha dd{margin:0;overflow-wrap:anywhere}
h3.secao{font:700 20px/1.2 var(--cond);margin:22px 0 4px;padding-top:14px;border-top:2px solid var(--ink)}
.q{margin-top:12px}
.q > p{margin:0 0 8px;font-weight:600}
.loc{padding:10px 12px;border:1px dashed var(--line);border-radius:10px;margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.loc p{margin:0;font-size:14px}
.aviso{background:var(--navy-soft);border-left:3px solid var(--navy);padding:8px 12px;border-radius:0 6px 6px 0;font-size:14px;margin-top:14px}
.aviso.red{background:var(--red-soft);border-color:var(--red)}
.hist{font-size:14px;border-bottom:1px solid var(--line);padding:8px 0}

/* Resumo executivo */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
@media (max-width:520px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:8px;padding:14px 16px}
.kpi.cad{border-top-color:var(--red)}
.kpi h3{font:700 18px/1.1 var(--cond);margin:0}
.kpi .num{font:700 44px/1 var(--cond);margin:10px 0 2px}
.kpi p{margin:0;color:var(--muted);font-size:14px}
.kpi .prog{margin-top:10px}
.tab-wrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
.barras{display:grid;gap:8px;margin-top:10px}
.br{display:grid;grid-template-columns:90px 1fr 70px;gap:10px;align-items:center;font-size:15px}
.br .t{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.br .t i{display:block;height:100%;background:var(--red)}
.br span:last-child{text-align:right;font-weight:600}
.pend{columns:2;column-gap:24px;font-size:14px;margin:8px 0 0;padding:0;list-style:none}
@media (max-width:520px){.pend{columns:1}}
.pend li{break-inside:avoid;padding:3px 0}
.pend button{background:none;border:0;padding:0;cursor:pointer;color:var(--navy);text-align:left;font-size:14px;text-decoration:underline;text-underline-offset:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:15px;z-index:50;max-width:90vw;display:none}
.toast.on{display:block}
.modo{font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
</style>
</head>

function montarApp(){S.app=Object.assign({},BASE.app,S.appEdit)}
function aplicarItem(it){
  if(it.tipo==='atend')S.atend[it.id]=it.dados;
  else if(it.tipo==='app')S.appEdit[it.id]=it.dados;
  else if(it.tipo==='config')S.config=it.dados;
}
function aplicarServidor(d){
  S.atend=d.atend||{};S.appEdit=d.app||{};S.config=d.config||{};
  S.pend.forEach(aplicarItem);montarApp();lsSave();
}
function renderSeguro(){
  if(S.tela==='ajustes'){const st=$('#syncStatus');if(st)st.innerHTML=statusSync();return}
  if(S.tela==='base'){const l=$('#lista');if(l&&document.activeElement&&document.activeElement.id==='busca'){l.innerHTML=htmlLista();return}}
  render();
}
async function puxar(){
  const c=conexao();if(!c.url){S.sync={estado:'local'};return}
  try{
    const r=await fetch(c.url+(c.url.includes('?')?'&':'?')+'chave='+encodeURIComponent(c.chave||''));
    const j=await r.json();
    if(j.ok){aplicarServidor(j.dados);S.sync={estado:'ok'}}
    else S.sync={estado:'erro',msg:j.erro==='chave'?'A chave não confere com a da planilha.':'A planilha respondeu com erro.'};
  }catch(e){S.sync={estado:'offline'}}
  renderSeguro();
}
async function enviar(){
  const c=conexao();
  if(!c.url||!S.pend.length||S.enviando)return;
  S.enviando=true;
  const lote=S.pend.slice();
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({chave:c.chave||'',itens:lote,planilhas:planilhasTexto()})});
    const j=await r.json();
    if(j.ok){S.pend=S.pend.slice(lote.length);aplicarServidor(j.dados);S.sync={estado:'ok'}}
    else S.sync={estado:'erro',msg:j.erro==='chave'?'A chave não confere com a da planilha.':'A planilha respondeu com erro.'};
  }catch(e){S.sync={estado:'offline'}}
  S.enviando=false;lsSave();renderSeguro();
  if(S.pend.length&&S.sync.estado==='ok')enviar();
}
function fila(it){S.pend.push(it);aplicarItem(it);montarApp();const ok=lsSave();render();enviar();return ok}
async function gravarAtend(a){return fila({tipo:'atend',id:a.id,dados:a})}
async function gravarApp(id,valor){return fila({tipo:'app',id,dados:{id,cadastrado:valor,em:new Date().toISOString()}})}
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));
function linkConexao(){const c=conexao();return location.origin+location.pathname+'#conectar='+b64e(JSON.stringify({u:c.url,k:c.chave||''}))}
function conectarPorToken(tok){
  try{
    const d=JSON.parse(b64d(tok));
    if(d&&d.u&&/^https:\/\/script\.google(usercontent)?\.com\//.test(d.u)){localStorage.setItem(LS_CON,JSON.stringify({url:d.u,chave:d.k||''}));S.sync={estado:'offline'};return true}
  }catch(e){}
  return false;
}
function lerLinkConexao(){
  const m=(location.hash||'').match(/^#conectar=([A-Za-z0-9_-]+)$/);if(!m)return false;
  try{
    const d=JSON.parse(b64d(m[1]));
    if(d&&d.u&&/^https:\/\/script\.google(usercontent)?\.com\//.test(d.u)){localStorage.setItem(LS_CON,JSON.stringify({url:d.u,chave:d.k||''}));S.sync={estado:'offline'};toast('Aparelho conectado à planilha.')}
  }catch(e){}
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
function statusSync(){
  const n=S.pend.length,pend=n?' '+n+(n===1?' resposta aguardando envio.':' respostas aguardando envio.'):'';
  if(S.sync.estado==='local')return 'Sem planilha conectada: as respostas ficam só neste aparelho.'+pend;
  if(S.sync.estado==='offline')return 'Sem conexão com a planilha agora. As respostas ficam guardadas e são enviadas quando a internet voltar.'+pend;
  if(S.sync.estado==='erro')return (S.sync.msg||'Erro ao falar com a planilha.')+pend;
  return n?'Enviando para a planilha...'+pend:'Tudo salvo na planilha Google.';
}
function appTag(c){
  const a=S.app[c.id];
  if(!a)return '<span class="tag">App: não informado</span>';
  return a.cadastrado?'<span class="tag ok">Cadastrado no App</span>':'<span class="tag red">Não cadastrado no App</span>';
}
async function gravarConfig(c){return fila({tipo:'config',id:'geral',dados:c})}

/* ---------- exportar e importar ---------- */
const P=x=>({t:'n',v:x/100,z:'0%'});
const simNao=v=>v==='sim'?'Sim':v==='nao'?'Não':'';
const dataBR=iso=>iso?new Date(iso).toLocaleString('pt-BR'):'';
function dadosPlanilha(){
  const B=doCenario('band'),C=doCenario('cadastro');
  const band=B.map(c=>{const a=S.atend[c.id]||{},v=a.volumes||{},ap=S.app[c.id];return {
    'PV':c.pv,'Cliente':c.nome,'Razão social':c.razaoSocial||'','Segmento':c.segmento,'Dia de pedido':c.diaTexto,'GC':c.gc,'Rota':c.rota,'Consultor':c.consultor,
    'Cadastrado no App':ap?(ap.cadastrado?'Sim':'Não'):'Não informado','Visitado no mês':visitado(c)?'Sim':'Não','Data da visita':dataBR(a.visitadoEm),
    'Possui contrato':simNao(a.contrato),'Fornecedor':a.contratoQual||'','Restrições':a.contratoRestricoes||'',
    'SKYY':v.skyy??'','CAMPARI':v.campari??'','APEROL':v.aperol??'','TURKEY':v.turkey??'',
    'Observações':a.obs||'','Localização da visita':a.local?linkLocal(a.local):''}});
  const cad=C.map(c=>{const a=S.atend[c.id]||{},d=a.cadastro||{};return {
    'Cód.':c.codigo,'Cliente':c.nome,'CPF/CNPJ da base':fmtCnpj(c.cnpj),'Endereço':endereco(c),'Visitado no mês':visitado(c)?'Sim':'Não','Data da visita':dataBR(a.visitadoEm),
    'Situação':STATUS_CAD[statusCad(a)],'Tem interesse':simNao(d.interesse),'Motivo':d.motivo?rotMotivo(d.motivo):'','Detalhe do motivo':d.motivoDetalhe||'',
    'CPF/CNPJ informado':d.cnpj||'','Nome fantasia':d.fantasia||'','Responsável':d.responsavel||'','E-mail':d.email||'','Telefones':d.telefones||'',
    'Documentos em mãos':(d.docs||[]).map(k=>(DOCS.find(x=>x[0]===k)||[,k])[1]).join('; '),'Enviado para cadastro em':dataBR(d.enviadoEm),
    'Observações':a.obs||'','Localização da visita':a.local?linkLocal(a.local):''}});
  const bv=B.filter(visitado).length,cv=C.filter(visitado).length;
  const ats=Object.values(S.atend).filter(a=>a.mes===mesAtual()&&a.tipo==='band');
  const comC=ats.filter(a=>a.contrato==='sim').length,semC=ats.filter(a=>a.contrato==='nao').length;
  const appSim=B.filter(c=>S.app[c.id]&&S.app[c.id].cadastrado).length,appNao=B.filter(c=>S.app[c.id]&&!S.app[c.id].cadastrado).length;
  const R=[['Resumo executivo, OnTRADE CAMPARI'],['Desenvolvedor',cfg('devNome')],['Exportado em',new Date().toLocaleString('pt-BR')],[],
    ['Execução do mês','Clientes','Visitados','Não visitados','Execução'],
    ['Clientes ativos BAND',B.length,bv,B.length-bv,P(pct(bv,B.length))],
    ['Clientes sem cadastro',C.length,cv,C.length-cv,P(pct(cv,C.length))],[],
    ['Execução por dia de pedido (BAND)','Clientes','Visitados','Não visitados','Execução']];
  DIAS.forEach(d=>{const l=B.filter(c=>noDia(c,d.k));if(!l.length)return;const v=l.filter(visitado).length;R.push([d.c,l.length,v,l.length-v,P(pct(v,l.length))])});
  R.push([],['Clientes que possuem contrato (BAND)','Clientes'],['Possui contrato',comC],['Não possui',semC],['Ainda sem resposta',B.length-comC-semC]);
  R.push([],['Cadastro no App (BAND)','Clientes','Percentual'],['Cadastrados no App',appSim,P(pct(appSim,B.length))],['Não cadastrados',appNao,P(pct(appNao,B.length))],['Não informado',B.length-appSim-appNao,P(pct(B.length-appSim-appNao,B.length))]);
  return {band,cad,R};
}
function planilhasTexto(){
  const {band,cad,R}=dadosPlanilha();
  const aoa=rows=>{const h=Object.keys(rows[0]||{});return [h].concat(rows.map(r=>h.map(k=>r[k]==null?'':r[k])))};
  return {resumo:R.map(l=>l.map(v=>v&&typeof v==='object'?Math.round(v.v*100)+'%':v)),band:aoa(band),cad:aoa(cad)};
}
function montarPlanilha(){
  const X=window.XLSX;
  const wb=X.utils.book_new();
  const {band,cad,R}=dadosPlanilha();
  const wr=X.utils.aoa_to_sheet(R);
  wr['!cols']=[{wch:38},{wch:12},{wch:12},{wch:14},{wch:12}];
  const largura=rows=>Object.keys(rows[0]||{}).map(k=>({wch:Math.min(45,Math.max(k.length+2,...rows.map(r=>String(r[k]??'').length+1)))}));
  const wb1=X.utils.json_to_sheet(band);wb1['!cols']=largura(band);
  const wc=X.utils.json_to_sheet(cad);wc['!cols']=largura(cad);
  X.utils.book_append_sheet(wb,wr,'Resumo executivo');
  X.utils.book_append_sheet(wb,wb1,'Clientes BAND');
  X.utils.book_append_sheet(wb,wc,'Clientes para Cadastrar');
  const json=JSON.stringify({versao:1,exportadoEm:new Date().toISOString(),atend:S.atend,app:S.appEdit,config:S.config});
  const partes=[['Cópia dos dados para importar na ferramenta. Não edite esta aba.']];
  for(let i=0;i<json.length;i+=30000)partes.push([json.slice(i,i+30000)]);
  const wbk=X.utils.aoa_to_sheet(partes);
  X.utils.book_append_sheet(wb,wbk,'_backup');
  wb.Workbook={Sheets:[{},{},{},{Hidden:1}]};
  return wb;
}
async function exportar(){
  if(!window.XLSX){toast('Sem conexão para gerar a planilha. Tente de novo com internet.');return}
  const nome='OnTRADE_CAMPARI_'+cfg('devNome').replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx';
  const buf=XLSX.write(montarPlanilha(),{bookType:'xlsx',type:'array'});
  const tipo='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  const arq=new File([buf],nome,{type:tipo});
  const toque=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  if(toque&&navigator.canShare&&navigator.canShare({files:[arq]})){
    try{await navigator.share({files:[arq],title:'OnTRADE CAMPARI'});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  const url=URL.createObjectURL(new Blob([buf],{type:tipo}));
  const a=document.createElement('a');a.href=url;a.download=nome;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Planilha gerada.');
}
function importar(arquivo){
  if(!window.XLSX){toast('Sem conexão para ler a planilha. Tente de novo com internet.');return}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});
      const sh=wb.Sheets['_backup'];
      if(!sh){toast('Esta planilha não foi exportada pela ferramenta.');return}
      const linhas=XLSX.utils.sheet_to_json(sh,{header:1}).slice(1).map(l=>l[0]||'').join('');
      const d=JSON.parse(linhas);
      const quando=d.exportadoEm?new Date(d.exportadoEm).toLocaleString('pt-BR'):'data desconhecida';
      if(!confirm('Carregar os dados exportados em '+quando+'? As respostas salvas neste aparelho serão substituídas.'))return;
      S.atend=d.atend||{};S.appEdit=d.app||{};S.config=d.config||{};montarApp();
      if(lsSave()){montada='';S.tela='inicio';render();toast('Dados carregados.')}
    }catch(e){toast('Não foi possível ler esta planilha.')}
  };
  r.readAsArrayBuffer(arquivo);
}

  const app=$('#app');
  const chave=S.tela+'|'+S.cenario;
  if(S.tela==='inicio'){app.innerHTML=telaInicio();montada=chave;return}
  if(S.tela==='base'){
    if(montada!==chave){app.innerHTML=cabecalho()+'<main class="wrap" id="corpo"></main>';montada=chave}
    $('#corpo').innerHTML=telaBase();return;
  }
  if(S.tela==='resumo'){
    if(montada!==chave){app.innerHTML=cabecalho()+'<main class="wrap" id="corpo"></main>';montada=chave}

  }
  if(S.tela==='ajustes'&&montada!==chave){app.innerHTML=cabecalho()+'<main class="wrap">'+telaAjustes()+'</main>';montada=chave}
}

function listaFiltrada(){
  const q=S.busca.trim().toLowerCase();
  return doCenario(S.cenario)
    .filter(c=>S.cenario!=='band'||noDia(c,S.dia))
    .filter(c=>S.filtro==='todos'||(S.filtro==='feitos'?visitado(c):!visitado(c)))
    .filter(c=>!q||[c.nome,c.razaoSocial,c.pv,c.codigo,c.bairro,c.enderecoCompleto,c.cnpj,c.gc,c.rota,c.consultor].join(' ').toLowerCase().includes(q))
    .sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
}

function htmlLista(){
  const band=S.cenario==='band';
  const lista=listaFiltrada();
  const base=doCenario(S.cenario).filter(c=>!band||noDia(c,S.dia));
  const v=base.filter(visitado).length;
  const rotulo=band?(S.dia==='todos'?'na base':'com pedido na '+DIAS.find(d=>d.k===S.dia).n):'para cadastrar';
  let h='<div class="resumo-linha"><p><strong>'+v+' de '+base.length+'</strong> visitados '+rotulo+' neste mês</p>';
  if(band&&S.dia!=='todos'&&base.some(c=>!visitado(c)))h+='<button class="btn sm" data-act="rota">'+ICO.route+'Rota dos que faltam</button>';
  h+='</div>';
  if(!S.carregado&&!S.clientes.length)return h+'<p class="vazio">Carregando a base...</p>';
  if(!lista.length)return h+'<p class="vazio">Nenhum cliente encontrado com esses filtros.</p>';
  h+='<ul class="lista">';
  lista.forEach(c=>{
    const ok=visitado(c),a=S.atend[c.id];
    let tags='';
    if(band)tags+=appTag(c);
    if(!band){
      const st=statusCad(a);
      tags+='<span class="tag">Cód. '+esc(c.codigo)+'</span><span class="tag'+(st==='enviado'?' ok':st==='sem_interesse'?' red':'')+'">'+STATUS_CAD[st]+'</span>';
    }
    if(a&&a.contrato==='sim')tags+='<span class="tag red">Com contrato</span>';
    h+='<li class="cli"><div class="status'+(ok?' ok':'')+'" aria-label="'+(ok?'Visitado neste mês':'Não visitado')+'">'+(ok?ICO.check:'')+'</div><div>'
      +'<button class="cli-nome" data-act="cliente" data-id="'+esc(c.id)+'">'+esc(c.nome)+'</button>'
      +(band
        ?'<p class="mini"><span>PV <b>'+esc(c.pv)+'</b></span><span>GC <b>'+esc(c.gc)+'</b></span><span>Rota <b>'+esc(c.rota)+'</b></span><span>Consultor <b>'+esc(c.consultor)+'</b></span></p>'
        :'<p class="sub">'+esc(endereco(c))+'</p>')
      +'<div class="tags">'+tags+'</div>'
      +'<div class="acoes"><button class="btn pri sm" data-act="cliente" data-id="'+esc(c.id)+'">'+(ok?'Ver atendimento':band?'Atender':'Cadastrar')+'</button>'
      +(band&&dig(c.telCV)?'<a class="btn sm" href="tel:'+dig(c.telCV)+'">'+ICO.phone+'Ligar CV</a>':'')
      +'<a class="btn sm" href="'+esc(mapaUrl(c))+'" target="_blank" rel="noopener">'+ICO.pin+'Mapa</a></div></div></li>';
  });
  return h+'</ul>';
}

function registrarLocal(id){
  const st=$('#locStatus');
  if(!navigator.geolocation){st.textContent='Este aparelho não informa localização.';return}
  st.textContent='Buscando localização...';
  navigator.geolocation.getCurrentPosition(p=>{
    locAtual={lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),precisao:Math.round(p.coords.accuracy)};
    const c=S.clientes.find(x=>x.id===id);
    let t='Registrada: '+locAtual.lat+', '+locAtual.lng+' (precisão de '+locAtual.precisao+' m).';
    if(c&&typeof c.lat==='number'){const d=distancia({lat:c.lat,lng:c.lng},locAtual);t+=' Você está a '+(d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km')+' do cliente.'}
    st.textContent=t;
  },err=>{st.textContent=err.code===1?'O acesso à localização foi negado. Libere a permissão do navegador e tente de novo.':'Não foi possível obter a localização agora. Tente de novo.'},
  {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
}
function lerForm(c){
  const ant=S.atend[c.id]||{};
  const historico=(ant.historico||[]).slice();
  if(ant.visitadoEm&&ant.mes!==mesAtual()){const {historico:_h,...snap}=ant;historico.push(snap);while(historico.length>12)historico.shift()}
  const a={id:c.id,tipo:c.tipo,clienteNome:c.nome,obs:$('#p_obs').value.trim(),local:locAtual,visitadoEm:new Date().toISOString(),mes:mesAtual(),historico};
  const marcado=n=>{const r=document.querySelector('input[name='+n+']:checked');return r?r.value:''};
  if(c.tipo==='band'){
    const contrato=marcado('contrato');
    const volumes={};MARCAS.forEach(m=>{const v=$('#v_'+m.k).value;if(v!=='')volumes[m.k]=Math.max(0,Number(v)||0)});
    Object.assign(a,{contrato,contratoQual:contrato==='sim'?$('#p_qual').value.trim():'',contratoRestricoes:contrato==='sim'?$('#p_restr').value.trim():'',volumes});
  }else{
    const g=k=>{const e=$('#k_'+k);return e?e.value.trim():''};
    const int=marcado('interesse'),antCad=ant.cadastro||{};
    const status=int==='nao'?'sem_interesse':int==='sim'?(antCad.status==='enviado'?'enviado':'interessado'):'pendente';
    a.cadastro={status,interesse:int,motivo:int==='nao'?marcado('motivo'):'',motivoDetalhe:int==='nao'?g('motivoDetalhe'):'',
      cnpj:g('cnpj'),fantasia:g('fantasia'),responsavel:g('responsavel'),email:g('email'),telefones:g('telefones'),
      docs:[...document.querySelectorAll('input[name=docs]:checked')].map(i=>i.value),enviadoEm:antCad.enviadoEm||null};
  }
  return a;
}

async function salvar(id,enviar){
  const c=S.clientes.find(x=>x.id===id);if(!c)return;
  const a=lerForm(c);
  if(enviar){
    if(c.tipo==='band')abrirWpp(cfg('wppResumo'),msgResumo(c,a));
    else{
      if(a.cadastro.interesse!=='sim'){toast('Marque que o cliente tem interesse para enviar o cadastro.');return}
      a.cadastro.status='enviado';a.cadastro.enviadoEm=new Date().toISOString();
      abrirWpp(cfg('wppCadastro'),msgCadastro(c,a));
    }
  }
  if(await gravarAtend(a)){$('#dlg').close();toast(enviar?'Atendimento salvo. Termine o envio no WhatsApp.':'Atendimento salvo.')}
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id;
  switch(t.dataset.act){
    case 'abrir':S.cenario=t.dataset.c;S.tela='base';S.dia=t.dataset.c==='band'?hojeKey():'todos';S.filtro='todos';S.busca='';render();scrollTo(0,0);break;
    case 'cen':S.cenario=t.dataset.c;S.tela='base';S.busca='';S.dia=t.dataset.c==='band'?(S.dia||'todos'):'todos';render();scrollTo(0,0);break;
    case 'inicio':S.tela='inicio';render();scrollTo(0,0);break;
    case 'tela':S.tela=t.dataset.t;render();scrollTo(0,0);break;
    case 'dia':S.dia=t.dataset.k;render();break;
    case 'filtro':S.filtro=t.dataset.f;render();break;
    case 'cliente':abrirCliente(id);break;
    case 'fechar':$('#dlg').close();break;
    case 'geo':registrarLocal(id);break;
    case 'salvar':salvar(id,false);break;
    case 'enviar':salvar(id,true);break;
    case 'rota':{
      const l=doCenario('band').filter(c=>noDia(c,S.dia)&&!visitado(c));
      const u=rotaUrl(l);if(!u)break;
      if(l.length>10)toast('O Google Maps aceita até 10 paradas. A rota usa as 10 primeiras.');
      window.open(u,'_blank','noopener');break;
    }
    case 'exportar':exportar();break;
    case 'colarLink':{
      const m=($('#colaLink').value||'').match(/#conectar=([A-Za-z0-9_-]+)/);
      if(m&&conectarPorToken(m[1])){montada='';render();toast('Aparelho conectado à planilha.');puxar().then(enviar)}
      else toast('Esse não é um link de conexão válido.');
      break;
    }
    case 'linkWpp':case 'linkCopiar':{
      if(!conexao().url||S.sync.estado!=='ok'){toast('Conecte este aparelho à planilha antes de enviar o link.');break}
      const l=linkConexao();
      if(t.dataset.act==='linkWpp'){
        window.open('https://wa.me/?text='+encodeURIComponent('Olá! Toque no link abaixo para abrir a ferramenta OnTRADE CAMPARI já conectada à planilha. Depois de abrir, salve a página nos favoritos ou na tela inicial do celular.\n\n'+l),'_blank','noopener');
      }else if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(l).then(()=>toast('Link de conexão copiado.'),()=>prompt('Copie o link de conexão:',l));
      }else prompt('Copie o link de conexão:',l);
      break;
    }
    case 'conectar':{
      const url=$('#conUrl').value.trim(),chave=$('#conChave').value.trim();
      if(url&&!/^https:\/\/script\.google(usercontent)?\.com\//i.test(url)){toast('O endereço precisa ser o do app da web do Apps Script.');break}
      try{localStorage.setItem(LS_CON,JSON.stringify({url,chave}))}catch(e){}
      $('#syncStatus').textContent='Conectando...';
      puxar().then(enviar).then(()=>{toast(S.sync.estado==='ok'?'Planilha conectada.':'Não foi possível conectar.')});
      break;
    }
    case 'salvarAjustes':{
      const v=k=>$('#a_'+k).value.trim();
      const url=v('myMapsUrl');
      if(url&&!/^https:\/\//i.test(url)){toast('O link do My Maps precisa começar com https://');break}
      gravarConfig(Object.assign({},S.config,{devNome:v('devNome'),marcas:v('marcas'),canal:v('canal'),myMapsUrl:url,wppResumo:v('wppResumo'),wppCadastro:v('wppCadastro')})).then(ok=>{if(ok){toast('Ajustes salvos.');montada=''}});
      break;
    }
  }
});
document.addEventListener('change',e=>{
  if(e.target.name==='contrato'){const b=$('#contratoSim');if(b)b.hidden=e.target.value!=='sim'}
  if(e.target.name==='interesse'){const s=e.target.value==='sim';$('#intSim').hidden=!s;$('#intNao').hidden=s;$('#btnEnvCad').hidden=!s}
  if(e.target.name==='app'){gravarApp(e.target.dataset.id,e.target.value==='sim').then(ok=>{if(ok)toast(e.target.value==='sim'?'Marcado como cadastrado no App.':'Marcado como não cadastrado no App.')})}
});
document.addEventListener('input',e=>{
  if(e.target.id==='busca'){S.busca=e.target.value;const l=$('#lista');if(l)l.innerHTML=htmlLista()}
});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

/* ---------- início ---------- */
S.clientes=BASE.clientes;lsLoad();montarApp();S.carregado=true;
if(conexao().url)S.sync={estado:'offline'};
lerLinkConexao();
render();
puxar().then(enviar);
window.addEventListener('online',()=>puxar().then(enviar));
setInterval(()=>{if(S.pend.length)enviar()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#dlg').open)puxar().then(enviar)});
})();
</script>
